<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魯建豪的動漫音樂世界 - 完美版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- 全局設定 --- */
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Noto Sans TC', sans-serif; color: white; user-select: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; justify-content: center; align-items: center; flex-direction: column; pointer-events: none; }
        
        .scene { opacity: 0; transition: opacity 0.8s ease-in-out; display: none; pointer-events: auto; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .scene.active { display: flex; opacity: 1; }
        
        /* 玻璃擬態面板 */
        .glass-panel {
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 60px;
            border-radius: 20px; text-align: center; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); max-width: 80%;
        }

        h1 { font-size: 3.5rem; margin: 0 0 30px 0; text-shadow: 0 0 15px #00ffff; letter-spacing: 5px; color: #fff; }
        .intro-text { font-size: 1.4rem; line-height: 1.8; margin-bottom: 30px; color: #eee; }
        
        /* 霓虹按鈕 */
        .cyber-btn {
            background: rgba(0, 255, 255, 0.1); color: #00ffff; border: 2px solid #00ffff; padding: 12px 50px;
            font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
            border-radius: 50px; font-weight: bold;
        }
        .cyber-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; transform: scale(1.05); }

        /* 圓形播放器 */
        .player-circle {
            width: 360px; height: 360px; border-radius: 50%;
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.15); box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; transition: box-shadow 0.2s;
        }
        .player-circle.playing { box-shadow: 0 0 60px rgba(255, 0, 255, 0.4); border-color: rgba(255, 0, 255, 0.4); }

        /* 歌曲資訊 */
        .song-info {
            text-align: center; margin-bottom: 20px; width: 85%; height: 80px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .song-title {
            font-size: 1.3rem; color: #ff00ff; text-shadow: 0 0 8px #ff00ff; font-weight: bold; margin-bottom: 5px;
            white-space: normal; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .artist-name { font-size: 0.9rem; color: #aaa; margin-top: 2px; }

        /* 控制區 */
        .controls-row { display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 25px; }
        .nav-btn { background: none; border: none; color: rgba(255, 255, 255, 0.6); font-size: 1.8rem; cursor: pointer; transition: 0.2s; padding: 10px; }
        .nav-btn:hover { color: #fff; transform: scale(1.2); text-shadow: 0 0 10px #fff; }

        .main-play-btn {
            width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #00ffff, #0088ff);
            border: none; color: white; font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); transition: all 0.3s; padding-left: 5px;
        }
        .main-play-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px #00ffff; }
        .main-play-btn.active { padding-left: 0; background: linear-gradient(135deg, #ff00ff, #ff0088); }

        /* 進度條 */
        .progress-wrapper { width: 75%; position: relative; }
        .progress-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: #00ffff; width: 0%; transition: width 0.1s linear; box-shadow: 0 0 10px #00ffff; }
        .time-text { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-top: 8px; }
        .interactive-hint { position: absolute; bottom: 20px; color: rgba(255,255,255,0.4); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        
        <div id="scene-1" class="scene active">
            <div class="glass-panel">
                <h1>我是魯建豪</h1>
                <button class="cyber-btn" onclick="nextScene(2)">繼續</button>
            </div>
        </div>

        <div id="scene-2" class="scene">
            <div class="glass-panel">
                <div class="intro-text">
                    由於我喜歡觀看日本動漫，很喜歡動漫裡的音樂，<br>
                    接下來將帶你進入我的動漫音樂世界。
                </div>
                <button class="cyber-btn" onclick="startMusicWorld()">開始體驗</button>
            </div>
        </div>

        <div id="scene-3" class="scene">
            <div class="player-circle" id="player-container">
                <div class="song-info">
                    <div class="song-title" id="song-title">Song Title</div>
                    <div class="artist-name" id="artist-name">Artist</div>
                </div>

                <div class="controls-row">
                    <button class="nav-btn" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
                    <button class="main-play-btn" id="play-btn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
                    <button class="nav-btn" onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
                </div>

                <div class="progress-wrapper">
                    <div class="progress-bg" onclick="setProgress(event)">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>
                    <div class="time-text">
                        <span id="curr-time">0:00</span>
                        <span id="dur-time">0:00</span>
                    </div>
                </div>
            </div>
            <div class="interactive-hint" id="status-msg">移動滑鼠探索空間 | 播放音樂感受節奏</div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        // --- 1. 更新資料 (使用標準 1.mp3 格式) ---
        const playlist = [
            { title: "紅蓮の弓矢", artist: "Linked Horizon", file: "1.mp3" },
            { title: "紅蓮華", artist: "LiSA", file: "2.mp3" },
            { title: "unravel", artist: "TK from 凛として時雨", file: "3.mp3" },
            { title: "MASAYUME CHASING", artist: "BoA", file: "4.mp3" },
            { title: "ないものねだり", artist: "KANA-BOON", file: "5.mp3" }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;
        let audioContext, analyser, dataArray, source;
        let audioInitialized = false;

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = playBtn.querySelector('i');
        const playerContainer = document.getElementById('player-container');
        const progressBar = document.getElementById('progress-bar');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('artist-name');
        const statusMsg = document.getElementById('status-msg');

        function nextScene(sceneNum) {
            document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(`scene-${sceneNum}`).classList.add('active');
            }, 300);
        }

        function startMusicWorld() {
            initAudioContext(); 
            nextScene(3);
            loadSong(currentSongIndex);
            playSong();
        }

        function initAudioContext() {
            if (audioInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
            } catch (e) { console.warn("Audio Context init failed."); }
        }

        function loadSong(index) {
            const song = playlist[index];
            titleEl.innerText = song.title;
            artistEl.innerText = song.artist;
            audio.src = song.file;
            progressBar.style.width = '0%';
        }

        function playSong() {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            
            audio.play().then(() => {
                isPlaying = true;
                playerContainer.classList.add('playing');
                playBtn.classList.add('active');
                playIcon.className = 'fas fa-pause';
                rotationSpeed = 0.02;
                statusMsg.innerText = "正在播放: " + playlist[currentSongIndex].title;
                statusMsg.style.color = "#00ffff";
            }).catch(error => {
                console.error("Play failed:", error);
                statusMsg.innerText = "播放失敗: 找不到檔案 " + playlist[currentSongIndex].file;
                statusMsg.style.color = "#ff3333";
                alert(`播放失敗！\n請確認您的資料夾中是否有：${playlist[currentSongIndex].file}`);
                isPlaying = false;
            });
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playerContainer.classList.remove('playing');
            playBtn.classList.remove('active');
            playIcon.className = 'fas fa-play';
            rotationSpeed = 0.005;
            statusMsg.innerText = "已暫停";
            statusMsg.style.color = "rgba(255,255,255,0.4)";
        }

        function togglePlay() { if (isPlaying) pauseSong(); else playSong(); }
        
        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            loadSong(currentSongIndex); if(isPlaying) playSong(); change3DColor();
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            loadSong(currentSongIndex); if(isPlaying) playSong(); change3DColor();
        }

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            if (isNaN(duration)) return;
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            document.getElementById('curr-time').innerText = formatTime(currentTime);
            document.getElementById('dur-time').innerText = formatTime(duration);
        });
        audio.addEventListener('ended', nextSong);

        function setProgress(e) {
            const width = e.currentTarget.clientWidth;
            const duration = audio.duration;
            audio.currentTime = (e.offsetX / width) * duration;
        }

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // --- 3D 特效 ---
        let scene, camera, renderer, mesh, innerMesh, stars;
        let rotationSpeed = 0.005;
        let mouseX = 0; let mouseY = 0;

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.IcosahedronGeometry(1.5, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.5 });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            const innerGeo = new THREE.IcosahedronGeometry(0.8, 2);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            innerMesh = new THREE.Mesh(innerGeo, innerMat);
            mesh.add(innerMesh);

            const starGeo = new THREE.BufferGeometry();
            const starCount = 3000;
            const posArray = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) {
                posArray[i] = (Math.random() - 0.5) * 150;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.15, color: 0xffffff });
            stars = new THREE.Points(starGeo, starMat);
            scene.add(stars);

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) / 100;
                mouseY = (e.clientY - window.innerHeight / 2) / 100;
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function change3DColor() {
            const colors = [0x00ffff, 0xff00ff, 0x00ff00, 0xffff00, 0xff3333];
            const color = colors[Math.floor(Math.random() * colors.length)];
            mesh.material.color.setHex(color);
        }

        function animate() {
            requestAnimationFrame(animate);

            mesh.rotation.x += rotationSpeed;
            mesh.rotation.y += rotationSpeed;
            stars.rotation.y -= 0.0002;

            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            let scaleBoost = 0;
            if (isPlaying && audioInitialized && analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < 20; i++) sum += dataArray[i];
                scaleBoost = (sum / 20) / 100; 
            } else if (isPlaying) {
                scaleBoost = Math.sin(Date.now() * 0.01) * 0.1;
            }

            const targetScale = 1 + scaleBoost;
            mesh.scale.setScalar(THREE.MathUtils.lerp(mesh.scale.x, targetScale, 0.2));
            innerMesh.scale.setScalar(1 - scaleBoost * 0.3);

            renderer.render(scene, camera);
        }

        init3D();
    </script>
</body>
</html>
