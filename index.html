<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魯建豪的動漫音樂世界 - 完美混合版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- 全局設定 --- */
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Noto Sans TC', sans-serif; color: white; user-select: none; }
        
        /* 1. Three.js 容器 (前兩段顯示) */
        #three-js-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; /* 底層 */
            transition: opacity 1.5s ease-in-out; /* 淡出動畫 */
            opacity: 1; /* 預設顯示 */
        }

        /* 2. 音樂頻譜畫布 (播放時顯示) */
        #visualizer-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; /* 在 3D 上層，但預設隱藏 */
            transition: opacity 1.5s ease-in-out;
            opacity: 0; /* 預設隱藏 */
            pointer-events: none;
        }

        /* 3. UI 層 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            pointer-events: none; 
        }
        
        /* 場景切換 */
        .scene { opacity: 0; transition: opacity 0.8s ease-in-out; display: none; pointer-events: auto; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .scene.active { display: flex; opacity: 1; }
        
        /* 玻璃面板 */
        .glass-panel {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 60px;
            border-radius: 20px; text-align: center; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); max-width: 80%;
        }

        h1 { font-size: 3.5rem; margin: 0 0 30px 0; text-shadow: 0 0 15px #00ffff; letter-spacing: 5px; color: #fff; }
        .intro-text { font-size: 1.4rem; line-height: 1.8; margin-bottom: 30px; color: #eee; }
        
        .cyber-btn {
            background: rgba(0, 255, 255, 0.1); color: #00ffff; border: 2px solid #00ffff; padding: 12px 50px;
            font-size: 1.2rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
            border-radius: 50px; font-weight: bold;
        }
        .cyber-btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; transform: scale(1.05); }

        /* 圓形播放器 */
        .player-circle {
            width: 360px; height: 360px; border-radius: 50%;
            background: rgba(10, 10, 10, 0.95); 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; 
            position: relative; z-index: 20;
        }

        .song-info { text-align: center; margin-bottom: 20px; width: 85%; height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .song-title { font-size: 1.3rem; color: #ff00ff; text-shadow: 0 0 8px #ff00ff; font-weight: bold; margin-bottom: 5px; white-space: normal; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .artist-name { font-size: 0.9rem; color: #aaa; margin-top: 2px; }

        .controls-row { display: flex; align-items: center; justify-content: center; gap: 25px; margin-bottom: 25px; }
        .nav-btn { background: none; border: none; color: rgba(255, 255, 255, 0.6); font-size: 1.8rem; cursor: pointer; transition: 0.2s; padding: 10px; }
        .nav-btn:hover { color: #fff; transform: scale(1.2); text-shadow: 0 0 10px #fff; }

        .main-play-btn { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #00ffff, #0088ff); border: none; color: white; font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); transition: all 0.3s; padding-left: 5px; }
        .main-play-btn:hover { transform: scale(1.1); box-shadow: 0 0 25px #00ffff; }
        .main-play-btn.active { padding-left: 0; background: linear-gradient(135deg, #ff00ff, #ff0088); }

        .progress-wrapper { width: 75%; position: relative; }
        .progress-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: #00ffff; width: 0%; transition: width 0.1s linear; box-shadow: 0 0 10px #00ffff; }
        .time-text { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-top: 8px; }
        .interactive-hint { position: absolute; bottom: 20px; color: rgba(255,255,255,0.4); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="three-js-container"></div>

    <canvas id="visualizer-canvas"></canvas>

    <div id="ui-layer">
        <div id="scene-1" class="scene active">
            <div class="glass-panel">
                <h1>我是魯建豪</h1>
                <button class="cyber-btn" onclick="nextScene(2)">繼續</button>
            </div>
        </div>

        <div id="scene-2" class="scene">
            <div class="glass-panel">
                <div class="intro-text">
                    由於我喜歡觀看日本動漫，很喜歡動漫裡的音樂，<br>
                    接下來將帶你進入我的動漫音樂世界。
                </div>
                <button class="cyber-btn" onclick="startMusicWorld()">開始體驗</button>
            </div>
        </div>

        <div id="scene-3" class="scene">
            <div class="player-circle" id="player-container">
                <div class="song-info">
                    <div class="song-title" id="song-title">Song Title</div>
                    <div class="artist-name" id="artist-name">Artist</div>
                </div>
                <div class="controls-row">
                    <button class="nav-btn" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
                    <button class="main-play-btn" id="play-btn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
                    <button class="nav-btn" onclick="nextSong()"><i class="fas fa-step-forward"></i></button>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-bg" onclick="setProgress(event)"><div class="progress-fill" id="progress-bar"></div></div>
                    <div class="time-text"><span id="curr-time">0:00</span><span id="dur-time">0:00</span></div>
                </div>
            </div>
            <div class="interactive-hint" id="status-msg">特效將隨音樂節奏在圓圈外跳動</div>
        </div>
    </div>

    <audio id="audio" crossorigin="anonymous"></audio>

    <script>
        // --- 變數與設定 ---
        const playlist = [
            { title: "紅蓮の弓矢", artist: "Linked Horizon", file: "1.mp3" },
            { title: "紅蓮華", artist: "LiSA", file: "2.mp3" },
            { title: "unravel", artist: "TK from 凛として時雨", file: "3.mp3" },
            { title: "MASAYUME CHASING", artist: "BoA", file: "4.mp3" },
            { title: "ないものねだり", artist: "KANA-BOON", file: "5.mp3" }
        ];

        let currentSongIndex = 0;
        let isPlaying = false;
        let audioContext, analyser, dataArray, source;
        let audioInitialized = false;

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = playBtn.querySelector('i');
        const progressBar = document.getElementById('progress-bar');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('artist-name');
        const statusMsg = document.getElementById('status-msg');
        
        // 背景控制元件
        const threeContainer = document.getElementById('three-js-container');
        const visualizerCanvas = document.getElementById('visualizer-canvas');
        const ctx = visualizerCanvas.getContext('2d');

        // --- 場景流程 ---
        function nextScene(sceneNum) {
            document.querySelectorAll('.scene').forEach(el => el.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(`scene-${sceneNum}`).classList.add('active');
            }, 300);
        }

        function startMusicWorld() {
            // 1. 切換 UI
            nextScene(3);
            
            // 2. 背景切換特效：3D 消失，光環出現
            threeContainer.style.opacity = '0'; // 隱藏 3D
            visualizerCanvas.style.opacity = '1'; // 顯示光環

            // 3. 啟動音頻
            initAudioContext(); 
            loadSong(currentSongIndex);
            playSong();
        }

        // --- 音樂播放邏輯 ---
        function initAudioContext() {
            if (audioInitialized) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioInitialized = true;
                drawVisualizer(); // 啟動光環繪製
            } catch (e) { 
                console.warn("Audio Context Error", e);
                drawVisualizer();
            }
        }

        function loadSong(index) {
            const song = playlist[index];
            titleEl.innerText = song.title;
            artistEl.innerText = song.artist;
            audio.src = song.file;
            progressBar.style.width = '0%';
        }

        function playSong() {
            if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            audio.play().then(() => {
                isPlaying = true;
                playBtn.classList.add('active');
                playIcon.className = 'fas fa-pause';
                statusMsg.innerText = "正在播放: " + playlist[currentSongIndex].title;
                statusMsg.style.color = "#00ffff";
            }).catch(error => {
                console.error("Play failed", error);
                statusMsg.innerText = "播放失敗，請檢查檔案";
                statusMsg.style.color = "#ff3333";
                isPlaying = false;
            });
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playBtn.classList.remove('active');
            playIcon.className = 'fas fa-play';
            statusMsg.innerText = "已暫停";
            statusMsg.style.color = "#aaa";
        }

        function togglePlay() { if (isPlaying) pauseSong(); else playSong(); }
        function prevSong() { currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length; loadSong(currentSongIndex); if(isPlaying) playSong(); }
        function nextSong() { currentSongIndex = (currentSongIndex + 1) % playlist.length; loadSong(currentSongIndex); if(isPlaying) playSong(); }

        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            if (isNaN(duration)) return;
            progressBar.style.width = `${(currentTime / duration) * 100}%`;
            document.getElementById('curr-time').innerText = formatTime(currentTime);
            document.getElementById('dur-time').innerText = formatTime(duration);
        });
        audio.addEventListener('ended', nextSong);

        function setProgress(e) {
            const width = e.currentTarget.clientWidth;
            const duration = audio.duration;
            audio.currentTime = (e.offsetX / width) * duration;
        }

        function formatTime(s) {
            const min = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // ==========================================
        // SYSTEM 1: Three.js 3D 模型 (前導頁用)
        // ==========================================
        let scene3D, camera3D, renderer3D, mesh3D, innerMesh3D, stars3D;
        let mouseX = 0, mouseY = 0;

        function initThreeJS() {
            const container = document.getElementById('three-js-container');
            scene3D = new THREE.Scene();
            scene3D.fog = new THREE.FogExp2(0x050505, 0.002);

            camera3D = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera3D.position.z = 6;

            renderer3D = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer3D.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer3D.domElement);

            // 外層幾何體
            const geometry = new THREE.IcosahedronGeometry(1.5, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.5 });
            mesh3D = new THREE.Mesh(geometry, material);
            scene3D.add(mesh3D);

            // 內層發光球
            const innerGeo = new THREE.IcosahedronGeometry(0.8, 2);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            innerMesh3D = new THREE.Mesh(innerGeo, innerMat);
            mesh3D.add(innerMesh3D);

            // 星空粒子
            const starGeo = new THREE.BufferGeometry();
            const starCount = 3000;
            const posArray = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) posArray[i] = (Math.random() - 0.5) * 150;
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMat = new THREE.PointsMaterial({ size: 0.15, color: 0xffffff });
            stars3D = new THREE.Points(starGeo, starMat);
            scene3D.add(stars3D);

            // 互動
            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) / 100;
                mouseY = (e.clientY - window.innerHeight / 2) / 100;
            });
            window.addEventListener('resize', () => {
                camera3D.aspect = window.innerWidth / window.innerHeight;
                camera3D.updateProjectionMatrix();
                renderer3D.setSize(window.innerWidth, window.innerHeight);
                visualizerCanvas.width = window.innerWidth; // 同步調整 Canvas
                visualizerCanvas.height = window.innerHeight;
            });

            animateThreeJS();
        }

        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);
            // 旋轉動畫
            mesh3D.rotation.x += 0.005;
            mesh3D.rotation.y += 0.005;
            stars3D.rotation.y -= 0.0002;
            // 滑鼠視差
            camera3D.position.x += (mouseX - camera3D.position.x) * 0.05;
            camera3D.position.y += (-mouseY - camera3D.position.y) * 0.05;
            camera3D.lookAt(scene3D.position);
            renderer3D.render(scene3D, camera3D);
        }

        // ==========================================
        // SYSTEM 2: Canvas Audio Visualizer (播放頁用)
        // ==========================================
        function resizeCanvas() {
            visualizerCanvas.width = window.innerWidth;
            visualizerCanvas.height = window.innerHeight;
        }
        resizeCanvas();

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            ctx.clearRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);
            
            const centerX = visualizerCanvas.width / 2;
            const centerY = visualizerCanvas.height / 2;
            let baseRadius = 190; 
            
            if (audioInitialized && analyser && isPlaying) {
                analyser.getByteFrequencyData(dataArray);
            } else if (isPlaying) {
                for(let i=0; i<dataArray.length; i++) dataArray[i] = Math.random() * 100; 
            } else {
                for(let i=0; i<dataArray.length; i++) dataArray[i] = 0;
            }

            const bars = 100; 
            const step = (Math.PI * 2) / bars;

            for (let i = 0; i < bars; i++) {
                const value = dataArray[i] || 0;
                const barHeight = (value / 255) * 150; 
                const hue = i * 4 + (Date.now() / 20); 
                
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(i * step);
                
                if (barHeight > 0) {
                    ctx.beginPath();
                    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    ctx.rect(-2, baseRadius, 4, barHeight);
                    ctx.fill();
                }
                ctx.restore();
            }

            // 低音背景震動
            let bass = 0;
            if (dataArray) {
                for (let i = 0; i < 10; i++) bass += dataArray[i];
                bass = bass / 10; 
            }
            if (bass > 100) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, baseRadius + bass, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(0, 255, 255, ${(bass - 100) / 1000})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // 啟動 3D 系統 (一開始就跑)
        initThreeJS();

    </script>
</body>
</html>
